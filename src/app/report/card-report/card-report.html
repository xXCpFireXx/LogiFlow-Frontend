<!-- Header with Title and Icon -->
<div class="flex justify-between items-start w-full">
    <h5 class="text-sm font-medium text-slate-500">
        {{ titulo() }}
    </h5>

    <!-- Dynamic Icon Container -->
    <div class="p-2 rounded-xl" [ngClass]="{
      'bg-green-100 text-green-600': icon() === 'shipment',
      'bg-blue-100 text-blue-600': icon() === 'transit',
      'bg-purple-100 text-purple-600': icon() === 'ontime',
      'bg-red-100 text-red-600': icon() === 'exception'
    }">
        @if (icon() === 'shipment') {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
            <polyline points="17 6 23 6 23 12"></polyline>
        </svg>
        } @else if (icon() === 'transit') {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="3" width="15" height="13"></rect>
            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
            <circle cx="5.5" cy="18.5" r="2.5"></circle>
            <circle cx="18.5" cy="18.5" r="2.5"></circle>
        </svg>
        } @else if (icon() === 'ontime') {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11"></polyline>
        </svg>
        } @else if (icon() === 'exception') {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        }
    </div>
</div>

<!-- Value and Description -->
<div class="mt-3 text-left">
    <h2 class="text-3xl font-bold text-slate-900 tracking-tight">
        {{ valor() }}
    </h2>

    <p class="mt-1 text-sm font-medium" [ngClass]="{
      'text-green-600': icon() === 'shipment',
      'text-red-600': icon() === 'exception',
      'text-slate-500': icon() !== 'shipment' && icon() !== 'exception'
    }">
        {{ description() }}
    </p>
</div>
