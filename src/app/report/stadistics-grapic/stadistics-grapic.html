<div class="mb-6">
    <h3 class="text-slate-900 font-bold text-lg">Delivery Performance</h3>
    <p class="text-slate-500 text-sm">Average Transit Time (Days)</p>
</div>

<div id="chart-container">
    <apx-chart [series]="performanceChartOptions.series!" [chart]="performanceChartOptions.chart!"
        [xaxis]="performanceChartOptions.xaxis!" [yaxis]="performanceChartOptions.yaxis!"
        [stroke]="performanceChartOptions.stroke!" [fill]="performanceChartOptions.fill!"
        [grid]="performanceChartOptions.grid!" [colors]="['#1E88E5']" [dataLabels]="{ enabled: false }">
    </apx-chart>
</div>
