<div class="flex items-end justify-between w-full pb-5">
    <app-header-main-content [title]="header.title" [description]="header.description"></app-header-main-content>

    <!--Botones Componente-->
    <div class="flex items-center gap-1 ">
        <div class="flex gap-20">
            <div>
                <button>
                    hola
                </button>
            </div>
            <div>
                <button>
                    Hola
                </button>
            </div>
        </div>
    </div>
</div>


<!--Card-->
<div class="py-6 w-full">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full">

        @for (item of cards; track item.titulo) {
        <app-card class="w-full">

            <app-card-report [titulo]="item.titulo" [valor]="item.valor" [description]="item.description"
                [icon]="item.icon">
            </app-card-report>
        </app-card>
        }
    </div>

</div>


<!--Estadisticas-->


<div class="flex justify-between mb-4">
    <div>
        <app-card>
            <!--componente barras azules-->
            <div class="flex justify-around items-end h-86 px-6">
                @for (data of regionData; track data.region) {
                <app-bard-chart-item class="flex-1" [region]="data.region" [porcentaje]="data.valor">
                </app-bard-chart-item>
                }
            </div>
            <!--span y logos-->
            <div class="flex items-center justify-center h-10">
                <div class="flex items-center ">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="1"></circle>
                    </svg>

                    <span>
                        Domestic
                    </span>
                </div>
                <div class="flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="1"></circle>

                    </svg>
                    <span>
                        International
                    </span>

                </div>
            </div>
        </app-card>
    </div>

    <div class="w-full">
        <app-card>

        </app-card>

    </div>

</div>
