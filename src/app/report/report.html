<div class="flex items-end justify-between w-full pb-5">
  <app-header-main-content [title]="header().title" [description]="header().description"></app-header-main-content>

  <!--Botones Componente-->
  <div class="flex items-center gap-3">
    <app-button-generic label="Last 30 Days" variant="secondary">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <svg icon-right xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </app-button-generic>

    <app-button-generic label="Export" variant="primary">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    </app-button-generic>
  </div>
</div>


<!--Card-->
<div class="py-6 w-full">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full">

    @for (item of cards(); track item.titulo) {
    <app-card class="w-full">

      <app-card-report [titulo]="item.titulo" [valor]="item.valor" [description]="item.description" [icon]="item.icon">
      </app-card-report>
    </app-card>
    }
  </div>

</div>


<!--Estadisticas-->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full">
  <!--Grafica de barras-->
  <app-card>
    <div class="flex justify-between items-start mb-6">
      <div>
        <h3 class="text-slate-900 font-bold text-lg">Weekly Shipment Volume</h3>
        <p class="text-slate-500 text-sm">Domestic vs International</p>
      </div>
      <button class="text-slate-400 hover:text-slate-600 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1" />
          <circle cx="19" cy="12" r="1" />
          <circle cx="5" cy="12" r="1" />
        </svg>
      </button>
    </div> <app-bar-stadistic></app-bar-stadistic>
  </app-card>
  <!--Grafica ondulada-->
  <app-card>
    <div class="flex justify-between items-start mb-6">
      <div>
        <h3 class="text-slate-900 font-bold text-lg">Delivery Performance</h3>
        <p class="text-slate-500 text-sm">Average Transit Time (Days)</p>
      </div>
      <button class="text-slate-400 hover:text-slate-600 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1" />
          <circle cx="19" cy="12" r="1" />
          <circle cx="5" cy="12" r="1" />
        </svg>
      </button>
    </div>
    <app-stadistics-grapic></app-stadistics-grapic>
  </app-card>

</div>
<div class="mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch ">
  <div class="lg:col-span-4">
    <app-card>
      <app-top-routes></app-top-routes>
    </app-card>
  </div>
  <div class="lg:col-span-8">
    <app-card>
      <app-recent-alerts></app-recent-alerts>
    </app-card>
  </div>
</div>
