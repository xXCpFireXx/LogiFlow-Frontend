<section class="flex flex-col min-[1048px]:flex-row min-[1048px]:items-center justify-between w-full pb-5 gap-6">
  <header class="flex flex-col min-w-0">
    <app-header-main-content [title]="header().title" [description]="header().description">
    </app-header-main-content>
  </header>

  <nav class="flex flex-wrap items-center gap-3 w-full min-[1048px]:w-auto justify-start min-[1048px]:justify-end">
    <app-button-generic label="Download" variant="secondary" (btnClick)="onExport()">
    </app-button-generic>

    <app-button-generic label="Create Shipment" variant="primary" (btnClick)="openModal()">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"
        stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"
        class="transition-colors group-hover:text-white">
        <path d="M11 21v-8H3v-2h8V3h2v8h8v2h-8v8z"></path>
      </svg>
    </app-button-generic>
  </nav>
</section>

<app-shipment-table [shipments]="shipments()" [currentPage]="currentPage()" [totalItems]="totalItems()"
  [totalPages]="totalPages()" (pageChange)="onPageChange($event)">
</app-shipment-table>

<app-modal [isOpen]="isModalOpen()" title="New Shipment" (close)="closeModal()">
  <form [formGroup]="shipmentForm" (ngSubmit)="submitShipment()" class="flex flex-col gap-5 text-left">

    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
      <h4 class="font-bold text-slate-800 mb-3 text-sm tracking-wide uppercase">Origin</h4>
      <div class="grid grid-cols-2 gap-4">

        <app-input-select label="Country" [value]="originCountryDisplay()" [options]="countryNames()"
          [isOpen]="isOriginCountryOpen()" (toggle)="isOriginCountryOpen.set(!isOriginCountryOpen())"
          (optionSelected)="onOriginCountrySelect($event)">
        </app-input-select>

        <app-input-select label="City" [value]="originCityDisplay()" [options]="originCities()"
          [disabled]="shipmentForm.get('originCity')?.disabled || false" [isOpen]="isOriginCityOpen()"
          (toggle)="isOriginCityOpen.set(!isOriginCityOpen())" (optionSelected)="onOriginCitySelect($event)">
        </app-input-select>

      </div>
    </div>

    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
      <h4 class="font-bold text-slate-800 mb-3 text-sm tracking-wide uppercase">Destination</h4>
      <div class="grid grid-cols-2 gap-4">

        <app-input-select label="Country" [value]="destCountryDisplay()" [options]="countryNames()"
          [isOpen]="isDestCountryOpen()" (toggle)="isDestCountryOpen.set(!isDestCountryOpen())"
          (optionSelected)="onDestCountrySelect($event)">
        </app-input-select>

        <app-input-select label="City" [value]="destCityDisplay()" [options]="destinationCities()"
          [disabled]="shipmentForm.get('destinationCity')?.disabled || false" [isOpen]="isDestCityOpen()"
          (toggle)="isDestCityOpen.set(!isDestCityOpen())" (optionSelected)="onDestCitySelect($event)">
        </app-input-select>

      </div>
    </div>

    <div class="flex justify-end items-center gap-3 pt-4 mt-2 border-t border-slate-100">

      <button type="button" (click)="closeModal()"
        class="text-sm font-semibold text-slate-500 hover:text-slate-800 cursor-pointer transition-colors px-4 py-2">
        Cancel
      </button>

      <button type="submit" [disabled]="shipmentForm.invalid"
        class="bg-blue-600 text-white text-sm font-semibold px-6 py-2.5 rounded-xl cursor-pointer shadow-sm hover:bg-blue-700 hover:shadow disabled:opacity-50 disabled:cursor-not-allowed transition-all">
        Confirm Shipment
      </button>
    </div>

  </form>
</app-modal>
