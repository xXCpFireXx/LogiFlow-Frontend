<!--Contenedor header-->
<div class="flex items-end justify-between w-full p-5">
    <div class="flex flex-col gap-0.5">
        <div>
            <h1 class="text-4xl font-medium">
                Dashboard Overview
            </h1>
        </div>
        <div>
            <span class="text-lg text-gray-500">
                Real-time logistic metrics and fleet status
            </span>
        </div>
    </div>

    <!--calendario-->
    <div class="flex items-center gap-1 ">
        <div class="text-gray-500">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M17 22v-3h-3v-2h3v-3h2v3h3v2h-3v3zM5 20q-.825 0-1.412-.587T3 18V6q0-.825.588-1.412T5 4h1V2h2v2h6V2h2v2h1q.825 0 1.413.588T19 6v6.1q-.5-.075-1-.075t-1 .075V10H5v8h7q0 .5.075 1t.275 1z"/>
            </svg>
        </div>
        <div>
            <span>Last updated: Just now</span>
        </div>
    </div>
</div>

<!--Cards-->
<div class="p-6">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    @for (item of cards; track item.titulo) {
      <app-card-dashboard 
        [titulo]="item.titulo" 
        [valor]="item.valor" 
        [porcentaje]="item.porcentaje">
      </app-card-dashboard>
    }
  </div>
</div>
