<!--Contenedor header-->
<div class="flex items-end justify-between w-full pb-5">
    <app-header-main-content
    [title]="header.title"
    [description]="header.description"
    ></app-header-main-content>

    <!--calendario-->
    <div class="flex items-center gap-1 ">
        <div class="text-gray-500">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M17 22v-3h-3v-2h3v-3h2v3h3v2h-3v3zM5 20q-.825 0-1.412-.587T3 18V6q0-.825.588-1.412T5 4h1V2h2v2h6V2h2v2h1q.825 0 1.413.588T19 6v6.1q-.5-.075-1-.075t-1 .075V10H5v8h7q0 .5.075 1t.275 1z"/>
            </svg>
        </div>
        <div>
            <span>Last updated: Just now</span>
        </div>
    </div>
</div>

<!--Cards-->
<div class="py-6 w-full">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full">
    @for (item of cards; track item.titulo) {
        <app-card class="w-full">
            <app-card-dashboard 
                [titulo]="item.titulo" 
                [valor]="item.valor" 
                [porcentaje]="item.porcentaje"
                [icon]="item.icon"
                [isNegative]="item.isNegative ?? false">
            </app-card-dashboard>
        </app-card>
    }
  </div>
</div>
