<aside class="relative bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden h-125 w-full">
  <app-live-fleet
    #mapDashboard
    [truckBlue]="truckPositions.blue"
    [truckOrange]="truckPositions.orange"
    class="w-full h-full block z-0">
  </app-live-fleet>

  <div class="absolute top-6 left-6 z-10 bg-white px-4 py-3 rounded-xl shadow-xl border border-slate-100">
    <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Current Location</span>
    <div class="flex items-center gap-2">
      <div class="h-2.5 w-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
      <span class="text-sm font-bold text-slate-800">{{ currentLocation }}</span>
    </div>
  </div>

  <div class="absolute bottom-6 right-6 z-10 flex flex-col gap-2">
    <button (click)="zoomIn()" class="w-10 h-10 bg-white rounded-xl shadow-lg flex items-center justify-center text-slate-600 hover:bg-[#e7f2fd] border border-slate-100 cursor-pointer active:scale-95 transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <button (click)="zoomOut()" class="w-10 h-10 bg-white rounded-xl shadow-lg flex items-center justify-center text-slate-600 hover:bg-[#e7f2fd] border border-slate-100 cursor-pointer active:scale-95 transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
  </div>
</aside>
