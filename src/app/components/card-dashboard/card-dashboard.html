<div class="max-w-xs p-5 bg-white border border-gray-100 rounded-2xl shadow-sm">
    
    <div class="flex flex-col">
        <div class="flex items-start justify-between mb-4">
            <div class="w-24">
                <h4 class="text-[15px] font-medium text-slate-400 leading-tight">
                    {{titulo()}}
                </h4>
            </div>
            <div class="p-2.5 bg-blue-50/80 rounded-xl text-blue-500">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm12.5-11.5l2.25 3h-3.25V7h1zm-5.5 11.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                </svg>
            </div>
        </div>

        <div class="flex items-center gap-2.5">
            <h2 class="text-3xl font-bold text-slate-800 tracking-tight">
                {{valor()}}
            </h2>
            <div class="inline-flex items-center gap-1 px-2 py-0.5 bg-emerald-50 text-emerald-600 rounded-md font-bold text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                    <polyline points="16 7 22 7 22 13"></polyline>
                </svg>
                <span>{{porcentaje()}}%</span>
            </div>
        </div>
    </div>
</div>
