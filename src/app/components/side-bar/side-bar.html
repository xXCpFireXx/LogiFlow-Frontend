<div *ngIf="isOpen" (click)="closeSideBar.emit()"
    class="fixed inset-0 z-40 bg-gray-900/50 backdrop-blur-sm sm:hidden transition-opacity">
</div>

<aside id="default-sidebar" [class.translate-x-0]="isOpen"
    class="fixed top-0 left-0 z-50 w-64 h-screen transition-transform -translate-x-full sm:translate-x-0"
    aria-label="Sidenav">
    <div class="overflow-y-auto py-5 px-3 h-full bg-white border-r border-gray-200 bg-white flex flex-col">

        <div class="flex items-center gap-3 mb-8 px-2">
            <div class="w-10 h-10 bg-[#e7f2fd] rounded-lg flex items-center justify-center">
                <svg aria-hidden="true" class="w-7 h-7 text-[#137fec]" fill="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M3.5 13v-3H1l3.5-5v3H7zm3.3 7q-1.25 0-2.125-.875T3.8 17q0-.625.288-1.175t.787-.95L10.85 6h-4.3l.425-2H18l-.925 4H20l3 4l-1 5h-2q0 1.25-.875 2.125T17 20t-2.125-.875T14 17H9.8q0 1.25-.875 2.125T6.8 20m.2-2q.425 0 .713-.288T8 17t-.288-.712T7 16t-.712.288T6 17t.288.713T7 18m10 0q.425 0 .713-.288T18 17t-.288-.712T17 16t-.712.288T16 17t.288.713T17 18m-1.075-5h4.825l.1-.525L19 10h-2.375z">
                    </path>
                </svg>
            </div>
            <div class="flex flex-col justify-center gap-1">
                <span class="text-xl font-bold text-gray-900 font-display tracking-tight leading-none">LogiFlow</span>
                <span class="text-xs text-gray-500">Operations Console</span>
            </div>
        </div>

        <ul class="space-y-2" (click)="onNavigate()">
            <li>
                <a routerLink="#"
                    class="flex items-center p-2 text-base font-normal rounded-lg transition-all group hover:bg-[#e7f2fd]">
                    <svg aria-hidden="true" class="w-6 h-6 text-gray-400 transition-colors group-hover:text-[#137fec]"
                        fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13 9V3h8v6zM3 13V3h8v10zm10 8V11h8v10zM3 21v-6h8v6z"></path>
                    </svg>
                    <span
                        class="flex-1 ml-3 text-gray-500 transition-colors group-hover:text-[#137fec] text-left whitespace-nowrap font-medium">Dashboard</span>
                </a>
            </li>
            <li>
                <a routerLink="#"
                    class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-[#e7f2fd] group">
                    <svg aria-hidden="true" class="w-6 h-6 text-gray-400 transition-colors group-hover:text-[#137fec]"
                        fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M5 21q-.825 0-1.412-.587T3 19V6.525q0-.35.113-.675t.337-.6L4.7 3.725q.275-.35.687-.538T6.25 3h11.5q.45 0 .863.188t.687.537l1.25 1.525q.225.275.338.6t.112.675V19q0 .825-.587 1.413T19 21zm.4-15h13.2l-.85-1H6.25zM16 8H8v8l4-2l4 2z">
                        </path>
                    </svg>
                    <span
                        class="flex-1 ml-3 text-gray-500 transition-colors group-hover:text-[#137fec] text-left whitespace-nowrap font-medium">Shipment</span>
                </a>
            </li>
            <li>
                <a routerLink="/tracking"
                    class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-[#e7f2fd] group">
                    <svg aria-hidden="true" class="w-6 h-6 text-gray-400 transition-colors group-hover:text-[#137fec]"
                        fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M14.35 20.775L9 18.9l-4.65 1.8q-.25.1-.488.063t-.437-.163t-.312-.337T3 19.775V5.75q0-.325.188-.575T3.7 4.8l4.65-1.575q.15-.05.313-.075T9 3.125t.338.025t.312.075L15 5.1l4.65-1.8q.25-.1.488-.062t.437.162t.313.338t.112.487V18.25q0 .325-.187.575t-.513.375l-4.65 1.575q-.15.05-.312.075t-.338.025t-.337-.025t-.313-.075M14 18.55V6.85l-4-1.4v11.7z">
                        </path>
                    </svg>
                    <span
                        class="flex-1 ml-3 text-gray-500 transition-colors group-hover:text-[#137fec] text-left whitespace-nowrap font-medium">Tracking</span>
                </a>
            </li>
            <li>
                <a routerLink="#"
                    class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-[#e7f2fd] group">
                    <svg aria-hidden="true" class="w-6 h-6 text-gray-400 transition-colors group-hover:text-[#137fec]"
                        fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 12q-1.65 0-2.825-1.175T8 8t1.175-2.825T12 4t2.825 1.175T16 8t-1.175 2.825T12 12m-8 8v-2.8q0-.85.438-1.562T5.6 14.55q1.55-.775 3.15-1.162T12 13t3.25.388t3.15 1.162q.725.375 1.163 1.088T20 17.2V20z">
                        </path>
                    </svg>
                    <span
                        class="flex-1 ml-3 text-gray-500 transition-colors group-hover:text-[#137fec] text-left whitespace-nowrap font-medium">Clients</span>
                </a>
            </li>
            <li>
                <a routerLink="/report"
                    class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-[#e7f2fd] group">
                    <svg aria-hidden="true" class="w-6 h-6 text-gray-400 transition-colors group-hover:text-[#137fec]"
                        fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M8 12h8v-2H8zm0-4h8V6H8zm11.95 12.475L15.9 15.2q-.425-.575-1.05-.887T13.5 14H4V4q0-.825.588-1.412T6 2h12q.825 0 1.413.588T20 4v16q0 .125-.012.238t-.038.237M6 22q-.825 0-1.412-.587T4 20v-4h9.5q.25 0 .463.113t.362.312l4.2 5.5q-.125.05-.262.063T18 22z">
                        </path>
                    </svg>
                    <span
                        class="flex-1 ml-3 text-gray-500 transition-colors group-hover:text-[#137fec] text-left whitespace-nowrap font-medium">Reports</span>
                </a>
            </li>
        </ul>
        <ul class="pt-5 mt-auto space-y-2 border-t border-gray-200 dark:border-gray-300 -mx-3 px-3"
            (click)="onNavigate()">
            <li>
                <a routerLink="#"
                    class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-[#e7f2fd] group">
                    <svg aria-hidden="true" class="w-6 h-6 text-gray-400 transition-colors group-hover:text-[#137fec]"
                        fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M10.825 22q-.675 0-1.162-.45t-.588-1.1L8.85 18.8q-.325-.125-.612-.3t-.563-.375l-1.55.65q-.625.275-1.25.05t-.975-.8l-1.175-2.05q-.35-.575-.2-1.225t.675-1.075l1.325-1Q4.5 12.5 4.5 12.337v-.675q0-.162.025-.337l-1.325-1Q2.675 9.9 2.525 9.25t.2-1.225L3.9 5.975q.35-.575.975-.8t1.25.05l1.55.65q.275-.2.575-.375t.6-.3l.225-1.65q.1-.65.588-1.1T10.825 2h2.35q.675 0 1.163.45t.587 1.1l.225 1.65q.325.125.613.3t.562.375l1.55-.65q.625-.275 1.25-.05t.975.8l1.175 2.05q.35.575.2 1.225t-.675 1.075l-1.325 1q.025.175.025.338v.674q0 .163-.05.338l1.325 1q.525.425.675 1.075t-.2 1.225l-1.2 2.05q-.35.575-.975.8t-1.25-.05l-1.5-.65q-.275.2-.575.375t-.6.3l-.225 1.65q-.1.65-.587 1.1t-1.163.45zm1.225-6.5q1.45 0 2.475-1.025T15.55 12t-1.025-2.475T12.05 8.5q-1.475 0-2.488 1.025T8.55 12t1.013 2.475T12.05 15.5">
                        </path>
                    </svg>
                    <span
                        class="flex-1 ml-3 text-gray-500 transition-colors group-hover:text-[#137fec] text-left whitespace-nowrap font-medium">Settings</span>
                </a>
            </li>
            <li>
                <a routerLink="#"
                    class="flex items-center p-2 text-base font-normal text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-[#e7f2fd] group">
                    <svg aria-hidden="true" class="w-6 h-6 text-gray-400 transition-colors group-hover:text-[#137fec]"
                        fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h6q.425 0 .713.288T12 4t-.288.713T11 5H5v14h6q.425 0 .713.288T12 20t-.288.713T11 21zm12.175-8H10q-.425 0-.712-.288T9 12t.288-.712T10 11h7.175L15.3 9.125q-.275-.275-.275-.675t.275-.7t.7-.313t.725.288L20.3 11.3q.3.3.3.7t-.3.7l-3.575 3.575q-.3.3-.712.288t-.713-.313q-.275-.3-.262-.712t.287-.688z">
                        </path>
                    </svg>
                    <span
                        class="flex-1 ml-3 text-gray-500 transition-colors group-hover:text-[#137fec] text-left whitespace-nowrap font-medium">Log
                        Out</span>
                </a>
            </li>
        </ul>
    </div>

</aside>
