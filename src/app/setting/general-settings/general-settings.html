<div class="flex flex-col gap-6">
      <div class="flex items-center gap-2 border-b border-slate-200 pb-4">
        <div class="text-blue-500">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
            <path fill="currentColor" d="M12 21q-.425 0-.712-.288T11 20v-4q0-.425.288-.712T12 15t.713.288T13 16v1h7q.425 0 .713.288T21 18t-.288.713T20 19h-7v1q0 .425-.288.713T12 21m-8-2q-.425 0-.712-.288T3 18t.288-.712T4 17h4q.425 0 .713.288T9 18t-.288.713T8 19zm4-4q-.425 0-.712-.288T7 14v-1H4q-.425 0-.712-.288T3 12t.288-.712T4 11h3v-1q0-.425.288-.712T8 9t.713.288T9 10v4q0 .425-.288.713T8 15m4-2q-.425 0-.712-.288T11 12t.288-.712T12 11h8q.425 0 .713.288T21 12t-.288.713T20 13zm4-4q-.425 0-.712-.288T15 8V4q0-.425.288-.712T16 3t.713.288T17 4v1h3q.425 0 .713.288T21 6t-.288.713T20 7h-3v1q0 .425-.288.713T16 9M4 7q-.425 0-.712-.288T3 6t.288-.712T4 5h8q.425 0 .713.288T13 6t-.288.713T12 7z"/>
          </svg>
        </div>
        <h3 class="text-lg font-bold text-slate-800">General Settings</h3>
      </div>

      <div class="flex flex-col gap-6">
        @for (drop of dropdowns; track drop.key) {
          <app-input-select
            [label]="drop.label"
            [value]="drop.key === 'language' ? userProfile.language : userProfile.timezone"
            [options]="drop.options"
            [helperText]="drop.helperText"
            [isOpen]="activeDropdown === drop.key"
            (toggle)="toggle.emit(drop.key)"
            (optionSelected)="selection.emit({ option: $event, key: drop.key })">
          </app-input-select>
        }

        <app-toggle-switch
          label="Email Notifications"
          description="Receive daily summaries of shipment statuses."
          [isActive]="true">
        </app-toggle-switch>

        <app-toggle-switch
          label="Beta Features"
          description="Enable experimental features in your dashboard."
          [isActive]="false">
        </app-toggle-switch>
      </div>
    </div>
