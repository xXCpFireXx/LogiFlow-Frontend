<div class="flex flex-col gap-6 h-full">
  <div class="flex items-center gap-3 border-b border-slate-200 pb-4">
    <div class="text-blue-500">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <h3 class="text-lg font-bold text-slate-800">Profile Information</h3>
  </div>

  <div class="flex items-center gap-4">
    <div class="w-15 h-15 rounded-full bg-slate-100 border-white shadow-sm flex items-center justify-center overflow-hidden">
      <img src="https://ui-avatars.com/api/?name=Cristian+Penagos&background=f1f5f9&color=64748b" alt="Avatar">
    </div>
    <div class="flex flex-col gap-1">
      <button (click)="onChangeAvatar()"
        class="text-blue-500 font-medium text-sm w-fit cursor-pointer outline-none transition-colors hover:text-blue-600">
        Change Avatar
      </button>
      <span class="text-xs text-slate-400">JPG, GIF or PNG. Max 1MB.</span>
    </div>
  </div>

  <div class="flex flex-col gap-6 flex-grow">
    <app-input-generic
      label="Full Name"
      [(value)]="userProfile.fullName"
      [iconPath]="icons.USER">
    </app-input-generic>

    <app-input-generic
      label="Email Address"
      [disabled]="true"
      [(value)]="userProfile.email"
      [iconPath]="icons.MAIL">
    </app-input-generic>

    <app-input-generic
      label="Role"
      [disabled]="true"
      [(value)]="userProfile.role"
      [iconPath]="icons.SHIELD">
    </app-input-generic>
  </div>

  <div class="pt-2 mt-auto">
    <button (click)="onUpdatePassword()" class="group w-full flex items-center justify-center gap-2 p-3 rounded-xl border border-slate-200 bg-white text-gray-700 font-medium text-sm transition-all cursor-pointer hover:bg-[#e7f2fd] hover:border-[#137fec]/50">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="text-slate-700 transition-colors group-hover:text-[#137fec]"><path d="M22 12q0 2.075-.788 3.9t-2.137 3.175t-3.175 2.138T12 22q-1.9 0-3.613-.675t-3.05-1.862t-2.187-2.8t-1.075-3.513q-.05-.475.225-.737t.65-.313t.725.163t.4.737q.375 3.025 2.638 5.025t5.287 2q3.35 0 5.675-2.325T20 12.025T17.675 6.35T12 4.025q-2.225 0-4.038 1.088T5.1 8H7q.425 0 .713.288T8 9t-.288.713T7 10H3q-.425 0-.712-.288T2 9V5q0-.425.288-.712T3 4t.713.288T4 5v1q1.375-1.825 3.45-2.912T12 2q2.075 0 3.9.788t3.175 2.137T21.213 8.1T22 12m-12 4q-.425 0-.712-.288T9 15v-3q0-.425.288-.712T10 11v-1q0-.825.588-1.412T12 8t1.413.588T14 10v1q.425 0 .713.288T15 12v3q0 .425-.288.713T14 16zm1-5h2v-1q0-.425-.288-.712T12 9t-.712.288T11 10z"/></svg>
      Update Password
    </button>
  </div>
</div>
