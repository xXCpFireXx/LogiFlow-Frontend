<div class="flex flex-col gap-2 relative"> <label class="text-sm font-bold text-slate-700">{{ label }}</label>

  <div (click)="!disabled && toggleMenu()" [class.bg-slate-100]="disabled" [class.opacity-60]="disabled"
    [class.cursor-not-allowed]="disabled" [class.cursor-pointer]="!disabled"
    class="flex items-center justify-between w-full p-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 text-sm transition-all">
    <span>{{ value }}</span>
    <div [class.rotate-180]="isOpen" class="transition-transform duration-300 text-slate-400">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>
  </div>

  @if (isOpen) {
    <div class="absolute left-0 right-0 top-full mt-1 z-[100] bg-white border border-slate-100 shadow-2xl rounded-xl py-1 max-h-48 overflow-y-auto">
      @for (opt of options; track opt) {
        <div (click)="selectOption(opt)"
             class="px-4 py-2 text-sm text-slate-600 hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition-colors">
          {{ opt }}
        </div>
      }
    </div>
  }
</div>
