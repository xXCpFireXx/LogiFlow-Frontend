<section class="flex flex-col min-[1048px]:flex-row min-[1048px]:items-center justify-between w-full pb-5 gap-6">
  <header class="flex flex-col min-w-0 flex-1">
    <app-header-main-content
      [title]="header().title"
      [description]="header().description">
    </app-header-main-content>
  </header>

  <nav class="flex flex-wrap items-center gap-3 w-full min-[1048px]:w-auto justify-start min-[1048px]:justify-end">
    <app-button-generic label="Cancel" variant="secondary" (btnClick)="onCancel()"></app-button-generic>

    <app-button-generic label="Save Changes" variant="primary" (btnClick)="onSave()">
      <svg icon xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-colors group-hover:text-white"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
    </app-button-generic>

  </nav>
</section>

<section class="grid grid-cols-1 lg:grid-cols-5 gap-6 items-stretch mt-4">

  <app-card class="lg:col-span-3 h-full flex flex-col [&>div]:h-full [&>div]:flex [&>div]:flex-col">
    <app-general-settings class="h-full block"
      [dropdowns]="dropdowns()"
      [userProfile]="userProfile()"
      [securityConfig]="securityConfig()"
      [activeDropdown]="activeDropdown()"
      (toggle)="toggleDropdown($event)"
      (selection)="handleSelection($event)">
    </app-general-settings>
  </app-card>

  <app-card class="lg:col-span-2 flex flex-col h-full">
    <app-profile-information class="h-full block"
      [userProfile]="userProfile()"
      [icons]="icons()"
      (changeAvatar)="onChangeAvatar()"
      (updatePassword)="onUpdatePassword()">
    </app-profile-information>
  </app-card>
</section>
