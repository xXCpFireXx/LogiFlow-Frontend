          type="button" class="group -ml-2 sm:hidden inline-flex items-center p-2 text-gray-400 hover:bg-[#e7f2fd] rounded-lg transition-all focus:outline-none">

        </button>
      </div>

      <div class="flex-1 flex justify-center sm:justify-start">

      <div class="flex items-center gap-1 sm:gap-3">
        <button class="group relative p-2 text-gray-500 hover:bg-[#e7f2fd] rounded-full transition-all cursor-pointer">

        </button>

        <div class="hidden sm:block w-px h-10 bg-gray-200 mx-1"></div>

        <app-user-profile-nav></app-user-profile-nav>
      </div>
    </div>
  </nav>
</header>
