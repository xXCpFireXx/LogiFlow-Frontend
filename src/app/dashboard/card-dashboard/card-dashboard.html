<div class="flex items-start justify-between mb-4">
    <div class="w-24">
        <h4 class="text-[15px] font-medium text-slate-400 leading-tight">
            {{title()}}
        </h4>
    </div>
    <div [class]="'p-2.5 rounded-xl ' + (isNegative() ? 'bg-red-50/80 text-red-500' :
                    icon() === 'transit' ? 'bg-indigo-50/80 text-indigo-500' :
                    icon() === 'revenue' ? 'bg-emerald-50/80 text-emerald-500' :
                    'bg-blue-50/80 text-blue-500')">
        @if (icon() === 'shipment') {
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path
                d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm12.5-11.5l2.25 3h-3.25V7h1zm-5.5 11.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
        </svg>
        } @else if (icon() === 'transit') {
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 3L3 10.53v.98l7.51 2.73L13.24 21h.98L21 3z" />
        </svg>
        } @else if (icon() === 'exception') {
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M1 21h22L12 2L1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z" />
        </svg>
        } @else if (icon() === 'revenue') {
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path
                d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
        </svg>
        }
    </div>
</div>

<div class="flex items-center gap-2.5">
    <h2 class="text-3xl font-bold text-slate-800 tracking-tight">
        {{value()}}
    </h2>
    <div [class]="'inline-flex items-center gap-1 px-2 py-0.5 rounded-md font-bold text-sm ' +
                    (isNegative() ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-600')">
        @if (isNegative()) {
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline>
            <polyline points="16 17 22 17 22 11"></polyline>
        </svg>
        } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
            <polyline points="16 7 22 7 22 13"></polyline>
        </svg>
        }
        <span>{{percentage()}}%</span>
    </div>
</div>
