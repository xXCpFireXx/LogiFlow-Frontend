<div class="flex items-end justify-between w-full pb-5">
  <app-header-main-content [title]="header().title" [description]="header().description">
  </app-header-main-content>

  <div class="flex items-center gap-1">
    <div class="text-gray-500">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
        <path fill="currentColor"
          d="M17 22v-3h-3v-2h3v-3h2v3h3v2h-3v3zM5 20q-.825 0-1.412-.587T3 18V6q0-.825.588-1.412T5 4h1V2h2v2h6V2h2v2h1q.825 0 1.413.588T19 6v6.1q-.5-.075-1-.075t-1 .075V10H5v8h7q0 .5.075 1t.275 1z" />
      </svg>
    </div>
    <div>
      <span class="text-sm text-gray-500">Last updated: Just now</span>
    </div>
  </div>
</div>

<div class="py-6 w-full">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full">
    @for (item of cards(); track item.title) {
    <app-card class="w-full">
      <app-card-dashboard [title]="item.title" [value]="item.value" [percentage]="item.percentage" [icon]="item.icon"
        [isNegative]="item.isNegative">
      </app-card-dashboard>
    </app-card>
    }
  </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-stretch">

  <div class="lg:col-span-2 flex flex-col">
    <app-card class="h-full">
      <div class="flex justify-between items-start pb-8">
        <div>
          <h5 class="text-lg font-bold text-gray-800">Shipment Volume by Region</h5>
          <span class="text-gray-400 text-sm">Last 30 Days Performance</span>
        </div>
        <div class="text-gray-400 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="19" cy="12" r="1"></circle>
            <circle cx="5" cy="12" r="1"></circle>
          </svg>
        </div>
      </div>

      <div class="w-full grow min-h-87.5">
        <app-bard-chart-item [regions]="regionData()"></app-bard-chart-item>
      </div>
    </app-card>
  </div>

  <div class="lg:col-span-1 flex flex-col">
    <app-card class="h-full">
      <div class="flex justify-between items-center pb-4">
        <h3 class="text-xl font-bold text-slate-800 tracking-tight">
          Live Fleet Overview
        </h3>
        <div class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </div>
      </div>

      <div class="grow -mx-5 -mb-5 border-t border-gray-100 overflow-hidden rounded-b-2xl min-h-100">
        <app-live-fleet class="h-full w-full" [truckBlue]="truckPositions().blue"
          [truckOrange]="truckPositions().orange">
        </app-live-fleet>
      </div>
    </app-card>
  </div>
</div>

<div class="pt-6 w-full">
  <app-shipment-table [shipments]="shipments()" [currentPage]="currentPage()" [totalItems]="totalItems()"
    [totalPages]="totalPages()" (pageChange)="onPageChange($event)">
  </app-shipment-table>
</div>
