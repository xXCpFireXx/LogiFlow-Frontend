<div
  [class]="size() + ' flex items-center justify-center overflow-hidden transition-all duration-300 group'"
  [ngClass]="{
    'rounded-xl shadow-lg shadow-blue-600/20 group-hover:scale-107': shape() === 'square',
    'rounded-full shadow-sm': shape() === 'circle'
  }"
  [style.backgroundColor]="avatarColor() ? '#' + avatarColor() : '#10b981'">

  <svg viewBox="0 0 100 100" class="w-full h-full transition-transform duration-300" [ngClass]="{'group-hover:scale-110': shape() === 'square'}">

    <text x="50%" y="50%" text-anchor="middle" dy=".35em" fill="white" font-weight="400" font-size="38">
      {{ initials() }}
    </text>
  </svg>
</div>
