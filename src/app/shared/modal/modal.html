@if (isOpen) {
<div
  class="fixed inset-0 z-1050 flex items-center justify-center bg-slate-900/40 backdrop-blur-xs transition-all duration-300">

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 border border-slate-100 transform transition-all">

    <div class="flex justify-between items-center px-6 py-4 border-b border-slate-100">
      <h3 class="text-xl font-bold text-slate-800">{{ title }}</h3>

      <button (click)="closeModal()"
        class="flex items-center justify-center w-8 h-8 cursor-pointer rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors focus:outline-none"
        aria-label="Close modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="p-6">
      <ng-content></ng-content>
    </div>

  </div>
</div>
}
