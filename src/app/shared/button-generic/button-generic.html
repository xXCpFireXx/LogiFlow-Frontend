<button (click)="btnClick.emit()"
  class="group flex items-center justify-center gap-2 px-4 py-2 rounded-lg font-medium transition-all cursor-pointer shadow-sm w-full min-[1048px]:w-auto border"
  [ngClass]="{
    'bg-[#137fec] text-white border-transparent hover:bg-blue-600': variant() === 'primary',
    'bg-slate-50 text-slate-700 border-slate-100 hover:bg-slate-100 hover:border-slate-200': variant() === 'secondary'
  }">
  <ng-content select="[icon]"></ng-content>

  <span>{{ label() }}</span>

  <ng-content select="[icon-right]"></ng-content>
</button>
