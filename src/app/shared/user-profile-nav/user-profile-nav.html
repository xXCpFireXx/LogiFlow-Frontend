@if (user(); as u) {
  <div class="flex items-center gap-2 group cursor-pointer">

    <div class="text-right hidden sm:block">
      <p class="text-sm font-bold text-gray-800 leading-none">{{ u.fullName }}</p>
      <p class="text-[10px] text-gray-500 font-medium">{{ u.role }}</p>
    </div>

    <!-- <div
      class="w-10 h-10 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/20 group-hover:scale-107 transition-all duration-300 overflow-hidden"
      [style.backgroundColor]="'#' + u.avatarColor">

      <img
        [src]="'https://ui-avatars.com/api/?name=' + u.fullName + '&background=' + u.avatarColor + '&color=fff&font-size=0.40'"
        alt="Profile"
        class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-100"
      >
    </div> -->
    <app-avatar
      [fullName]="u.fullName"
      [avatarColor]="u.avatarColor"
      shape="square"
      size="w-10 h-10">
    </app-avatar>

  </div>
} @else {
  <div class="flex items-center gap-2 animate-pulse">
    <div class="text-right hidden sm:block">
      <div class="h-3 w-20 bg-slate-200 rounded mb-1"></div>
      <div class="h-2 w-12 bg-slate-100 rounded"></div>
    </div>
    <div class="w-10 h-10 bg-slate-200 rounded-2xl"></div>
  </div>
}
