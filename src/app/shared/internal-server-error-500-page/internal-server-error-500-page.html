<section class="bg-white dark:bg-gray-50 h-screen flex items-center">
  <div class="py-8 px-4 mx-auto max-w-7xl lg:py-16 lg:px-6">
    <div class="mx-auto max-w-screen-sm text-center">
      <h1 class="mb-4 text-7xl tracking-tight font-extrabold lg:text-9xl text-blue-500 dark:text-blue-500">{{ errorContent.code }}</h1>
      <p class="mb-4 text-3xl tracking-tight font-bold text-gray-900 md:text-4xl dark:text-slate-800">{{ errorContent.title }}</p>
      <p class="mb-4 text-lg font-light text-gray-500 dark:text-gray-500">{{ errorContent.message }}</p>
      <a [routerLink]="errorContent.btnLink" class="inline-flex text-white bg-blue-500 hover:bg-blue-600 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:focus:ring-blue-400 my-4 transition-all">{{ errorContent.btnText }}</a>
      <p class="text-xs text-gray-400 italic">Redirecting to dashboard in 10 seconds...</p>
    </div>
  </div>
</section>
